name: Build and Publish Umn1Notch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debian Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz dpkg

      - name: Install Theos
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/theos/sdks"

      - name: Install iOS SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          SDK_PATH="$(find "$RUNNER_TEMP/theos-sdks" \
            -mindepth 1 -maxdepth 1 -type d \
            -name 'iPhoneOS*.sdk' | sort -V | tail -n 1)"

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: iOS SDK not found"
            exit 1
          fi

          cp -R "$SDK_PATH" "$RUNNER_TEMP/theos/sdks/"

      - name: Compile Umn1Notch
        run: make package FINALPACKAGE=1

      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          echo "Built package: $DEB"
          dpkg-deb -f "$DEB" Package
          dpkg-deb -f "$DEB" Version
          dpkg-deb -f "$DEB" Architecture
          test "$(dpkg-deb -f "$DEB" Package)" = "com.umn1notch.tweak"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Umn1Notch-deb
          path: packages/*.deb
          if-no-files-found: error

  publish:
    name: Publish Sileo APT Repository
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: Umn1Notch-deb
          path: downloaded-deb

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip python3

      - name: Generate APT repository
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/debs

          DEB="$(find downloaded-deb -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            echo "ERROR: Debian package not found"
            exit 1
          fi

          PACKAGE_NAME="$(dpkg-deb -f "$DEB" Package)"
          PACKAGE_ARCH="$(dpkg-deb -f "$DEB" Architecture)"

          if [ "$PACKAGE_NAME" != "com.umn1notch.tweak" ]; then
            echo "ERROR: Unexpected package name: $PACKAGE_NAME"
            exit 1
          fi

          if [ "$PACKAGE_ARCH" != "iphoneos-arm64" ]; then
            echo "ERROR: Unexpected package architecture: $PACKAGE_ARCH"
            exit 1
          fi

          cp "$DEB" _site/debs/
          cd _site

          dpkg-scanpackages --arch iphoneos-arm64 debs /dev/null > Packages

          if [ ! -s Packages ]; then
            echo "ERROR: Packages index is empty"
            exit 1
          fi

          grep -q '^Package: com.umn1notch.tweak$' Packages
          grep -q '^Architecture: iphoneos-arm64$' Packages

          gzip -9 -n -c Packages > Packages.gz
          gzip -t Packages.gz

          # Build a flat-repository Release file with the standard APT fields
          # and checksums for both index files. The Release file itself is not
          # checksummed, avoiding a self-referential checksum.
          python3 - <<'PY'
          from datetime import datetime, timezone
          from hashlib import md5, sha1, sha256, sha512
          from pathlib import Path

          index_files = ("Packages", "Packages.gz")
          algorithms = (
              ("MD5Sum", md5),
              ("SHA1", sha1),
              ("SHA256", sha256),
              ("SHA512", sha512),
          )

          lines = [
              "Origin: Umn1Chelovek",
              "Label: Umn1Notch",
              "Suite: stable",
              "Codename: ios",
              "Version: 1.0",
              "Date: " + datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000"),
              "Architectures: iphoneos-arm64",
              "Components: main",
              "Description: Umn1Notch Rootless Repository",
          ]

          for section_name, hash_function in algorithms:
              lines.append(section_name + ":")
              for filename in index_files:
                  data = Path(filename).read_bytes()
                  digest = hash_function(data).hexdigest()
                  lines.append(f" {digest} {len(data)} {filename}")

          Path("Release").write_text("\n".join(lines) + "\n", encoding="ascii")
          PY

          # Validate Release metadata before deploying it.
          grep -q '^Architectures: iphoneos-arm64$' Release
          grep -q '^MD5Sum:$' Release
          grep -q '^SHA1:$' Release
          grep -q '^SHA256:$' Release
          grep -q '^SHA512:$' Release

          echo "Generated Release file:"
          cat Release

          touch .nojekyll

          cat > index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Umn1Notch Repository</title>
          </head>
          <body>
            <h1>Umn1Notch</h1>
            <p>Official APT repository.</p>
            <p>Rootless package for iOS 15 and newer.</p>
            <p>Maintained by Umn1Chelovek.</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
